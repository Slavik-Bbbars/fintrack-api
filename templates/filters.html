<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fintrack — Фильтры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --surface: #12121a; --border: #1e1e2e;
    --accent: #7c6af7; --text: #e8e8f0; --muted: #6b6b80;
    --danger: #f56565; --income: #3ecf8e; --expense: #f56565;
  }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,15,.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 60px;
  }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 4px; list-style: none; }
  .nav-links a { display: block; padding: 7px 14px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; transition: color .2s, background .2s; }
  .nav-links a:hover { color: var(--text); background: var(--border); }
  .nav-links a.active { color: var(--accent); background: var(--border); }
  .btn-logout { background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; transition: border-color .2s, color .2s; }
  .btn-logout:hover { border-color: var(--danger); color: var(--danger); }
  main { max-width: 1100px; margin: 0 auto; padding: 36px 24px; }
  .page-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.5px; margin-bottom: 4px; }
  .page-sub { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
  .filters {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; margin-bottom: 24px;
    display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap;
  }
  .filter-group { display: flex; flex-direction: column; gap: 8px; min-width: 150px; }
  label { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  select {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 14px; color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 14px; outline: none; cursor: pointer; transition: border-color .2s;
  }
  select:focus { border-color: var(--accent); }
  .toggle-row { display: flex; gap: 8px; }
  .toggle-btn { flex: 1; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; transition: all .2s; }
  .toggle-btn.active-income { background: rgba(62,207,142,.12); border-color: var(--income); color: var(--income); }
  .toggle-btn.active-expense { background: rgba(245,101,101,.12); border-color: var(--expense); color: var(--expense); }
  .checkbox-row { display: flex; align-items: center; gap: 10px; padding-bottom: 2px; }
  .checkbox-row input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  .checkbox-row span { font-size: 14px; }
  .btn-apply { background: var(--accent); border: none; border-radius: 10px; padding: 11px 24px; color: #fff; font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .2s; align-self: flex-end; }
  .btn-apply:hover { opacity: .85; }
  .error-hint { color: var(--danger); font-size: 13px; margin-bottom: 16px; display: none; }
  .error-hint.show { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; animation: fadeUp .4s ease both; }
  .result-title { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 600; margin-bottom: 20px; }
  .chart-wrap { position: relative; height: 280px; }
  .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .full-width { grid-column: span 2; }
  .empty-chart { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px; color: var(--muted); font-size: 14px; }
  .empty-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .list-item { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--border); }
  .list-item:last-child { border-bottom: none; }
  .list-left { display: flex; align-items: center; gap: 12px; }
  .item-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .item-icon.income { background: rgba(62,207,142,.12); }
  .item-icon.expense { background: rgba(245,101,101,.12); }
  .item-cat { font-size: 14px; font-weight: 500; }
  .item-date { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .item-amount { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 600; }
  .item-amount.income { color: var(--income); }
  .item-amount.expense { color: var(--expense); }
  .placeholder { color: var(--muted); font-size: 14px; padding: 40px; text-align: center; }
</style>
</head>
<body>
<nav>
  <div class="logo">fin<span>track</span></div>
  <ul class="nav-links">
    <li><a href="index.html">Главная</a></li>
    <li><a href="alltime.html">За год</a></li>
    <li><a href="filters.html" class="active">Фильтры</a></li>
    <li><a href="records.html">Записи</a></li>
    <li><a href="add.html">+ Добавить</a></li>
  </ul>
  <button class="btn-logout" onclick="logout()">Выйти</button>
</nav>
<main>
  <div class="page-title">Фильтры</div>
  <div class="page-sub">Выберите хотя бы один фильтр</div>

  <div class="filters">
    <div class="filter-group">
      <label>Тип</label>
      <div class="toggle-row">
        <button class="toggle-btn active-income" id="btnIncome" onclick="setType('income')">Доходы</button>
        <button class="toggle-btn" id="btnExpense" onclick="setType('expense')">Расходы</button>
      </div>
    </div>
    <div class="filter-group">
      <label>Категория</label>
      <select id="categorySelect">
        <option value="">Все категории</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Текущий месяц</label>
      <div class="checkbox-row">
        <input type="checkbox" id="monthCheck" checked>
        <span id="monthLabel"></span>
      </div>
    </div>
    <button class="btn-apply" onclick="applyFilters()">Применить</button>
  </div>

  <div class="error-hint" id="filterError">⚠ Выберите хотя бы один фильтр — месяц или категорию</div>

  <div id="results">
    <div class="result-card">
      <div class="placeholder">Настройте фильтры и нажмите «Применить»</div>
    </div>
  </div>
</main>
<script>
  const API = 'http://localhost:8000';
  const token = localStorage.getItem('token');
  if (!token) window.location.href = 'login.html';

  const INCOME_CATS = ['Зарплата','Фриланс','Подарок','Инвестиции','Другое'];
  const EXPENSE_CATS = ['Продукты','Транспорт','Жильё и ЖКХ','Здоровье','Развлечения','Одежда','Образование','Спорт','Кафе и рестораны','Путешествия','Техника','Другое'];
  const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const ICONS = {'Продукты':'🛒','Транспорт':'🚇','Жильё и ЖКХ':'🏠','Здоровье':'💊','Развлечения':'🎮','Одежда':'👕','Образование':'📚','Спорт':'🏃','Кафе и рестораны':'☕','Путешествия':'✈️','Техника':'💻','Другое':'📦','Зарплата':'💼','Фриланс':'🖥️','Подарок':'🎁','Инвестиции':'📈'};

  let currentType = 'income';
  const now = new Date();
  document.getElementById('monthLabel').textContent = `${MONTHS[now.getMonth()]} ${now.getFullYear()}`;

  function setType(t) {
    currentType = t;
    document.getElementById('btnIncome').className = 'toggle-btn' + (t==='income' ? ' active-income' : '');
    document.getElementById('btnExpense').className = 'toggle-btn' + (t==='expense' ? ' active-expense' : '');
    fillCategories();
  }

  function fillCategories() {
    const sel = document.getElementById('categorySelect');
    const cats = currentType === 'income' ? INCOME_CATS : EXPENSE_CATS;
    sel.innerHTML = '<option value="">Все категории</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
  }

  function fmt(n) {
    return new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(n);
  }

  function groupByMonth(data) {
    // группируем по месяцам, последние 6
    const map = {};
    data.forEach(f => {
      const d = new Date(f.created_at);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      map[key] = (map[key] || 0) + f.amount;
    });
    // берём последние 6 месяцев
    return Object.entries(map).sort((a,b) => a[0].localeCompare(b[0])).slice(-6)
      .map(([k,v]) => {
        const [y,m] = k.split('-');
        return [MONTHS[parseInt(m)-1] + ' ' + y, v];
      });
  }

  function groupByCategory(data) {
    const map = {};
    data.forEach(f => { map[f.category] = (map[f.category] || 0) + f.amount; });
    return Object.entries(map).sort((a,b) => b[1]-a[1]);
  }

  async function apiFetch(url) {
    const res = await fetch(`${API}${url}`, { headers: { 'Authorization': `Bearer ${token}` } });
    if (res.status === 401) { logout(); return []; }
    return res.json();
  }

  async function applyFilters() {
    const category = document.getElementById('categorySelect').value;
    const monthBool = document.getElementById('monthCheck').checked;
    const errEl = document.getElementById('filterError');

    if (!category && !monthBool) { errEl.classList.add('show'); return; }
    errEl.classList.remove('show');

    const type = currentType;
    let data = [];

    if (category && !monthBool) {
      // только категория → все данные по категории, рисуем по месяцам
      data = await apiFetch(`/finance/month-category?type=${type}&category=${encodeURIComponent(category)}&month_bool=false`);
      renderCategoryByMonth(data, category, type);
    } else if (!category && monthBool) {
      // только месяц → все по месяцу, столбчатый по категориям
      data = await apiFetch(`/finance/month-category?type=${type}&month_bool=true`);
      renderMonthByCategory(data, type);
    } else {
      // оба → месяц + категория, столбец с транзакциями
      data = await apiFetch(`/finance/month-category?type=${type}&month_bool=true&category=${encodeURIComponent(category)}`);
      renderBoth(data, category, type);
    }
  }

  function renderCategoryByMonth(data, category, type) {
    const color = type === 'income' ? '#3ecf8e' : '#f56565';
    const months = groupByMonth(data);
    const results = document.getElementById('results');

    if (!months.length) {
      results.innerHTML = '<div class="result-card"><div class="placeholder">Нет данных по этой категории</div></div>';
      return;
    }

    results.innerHTML = `
      <div class="result-card">
        <div class="result-title">«${category}» — динамика за последние 6 месяцев</div>
        <div class="chart-wrap"><canvas id="chart1"></canvas></div>
      </div>`;

    new Chart(document.getElementById('chart1'), {
      type: 'bar',
      data: {
        labels: months.map(e => e[0]),
        datasets: [{ data: months.map(e => e[1]), backgroundColor: color, borderRadius: 8, borderSkipped: false }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${fmt(ctx.parsed.y)}` } } },
        scales: {
          x: { grid: { color: 'rgba(255,255,255,.04)' }, ticks: { color: '#6b6b80', font: { family: 'DM Sans' } } },
          y: { grid: { color: 'rgba(255,255,255,.04)' }, ticks: { color: '#6b6b80', font: { family: 'DM Sans' }, callback: v => fmt(v) } }
        }
      }
    });
  }

  function renderMonthByCategory(data, type) {
    const color = type === 'income' ? '#3ecf8e' : '#f56565';
    const groups = groupByCategory(data);
    const total = data.reduce((s,f) => s+f.amount, 0);
    const results = document.getElementById('results');

    if (!groups.length) {
      results.innerHTML = '<div class="result-card"><div class="placeholder">Нет данных за текущий месяц</div></div>';
      return;
    }

    results.innerHTML = `
      <div class="results-grid">
        <div class="result-card full-width">
          <div class="result-title">За текущий месяц · итого ${fmt(total)}</div>
          <div class="chart-wrap"><canvas id="chart2"></canvas></div>
        </div>
      </div>`;

    new Chart(document.getElementById('chart2'), {
      type: 'bar',
      data: {
        labels: groups.map(e => e[0]),
        datasets: [{ data: groups.map(e => e[1]), backgroundColor: color, borderRadius: 8, borderSkipped: false }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${fmt(ctx.parsed.y)}` } } },
        scales: {
          x: { grid: { color: 'rgba(255,255,255,.04)' }, ticks: { color: '#6b6b80', font: { family: 'DM Sans', size: 11 } } },
          y: { grid: { color: 'rgba(255,255,255,.04)' }, ticks: { color: '#6b6b80', font: { family: 'DM Sans' }, callback: v => fmt(v) } }
        }
      }
    });
  }

  function renderBoth(data, category, type) {
    const results = document.getElementById('results');
    const total = data.reduce((s,f) => s+f.amount, 0);

    if (!data.length) {
      results.innerHTML = '<div class="result-card"><div class="placeholder">Нет данных по выбранным фильтрам</div></div>';
      return;
    }

    const sorted = [...data].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    results.innerHTML = `
      <div class="result-card">
        <div class="result-title">«${category}» за текущий месяц · ${fmt(total)}</div>
        <div id="transList"></div>
      </div>`;

    document.getElementById('transList').innerHTML = sorted.map(f => `
      <div class="list-item">
        <div class="list-left">
          <div class="item-icon ${type}">${ICONS[f.category]||'📌'}</div>
          <div>
            <div class="item-cat">${f.category}</div>
            <div class="item-date">${new Date(f.created_at).toLocaleDateString('ru-RU')}</div>
          </div>
        </div>
        <div class="item-amount ${type}">${type==='income'?'+':'-'}${fmt(f.amount)}</div>
      </div>`).join('');
  }

  function logout() { localStorage.removeItem('token'); window.location.href = 'login.html'; }

  fillCategories();
  applyFilters(); // дефолт — текущий месяц
</script>
</body>
</html>
