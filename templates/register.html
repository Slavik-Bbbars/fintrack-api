<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fintrack — Регистрация</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --accent: #7c6af7;
    --accent2: #3ecf8e;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --danger: #f56565;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(124,106,247,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,247,.04) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  .glow {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: .15;
    pointer-events: none;
  }
  .glow-1 { background: var(--accent2); top: -200px; right: -100px; }
  .glow-2 { background: var(--accent); bottom: -200px; left: -100px; }

  .card {
    position: relative; z-index: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px;
    width: 100%;
    max-width: 420px;
    animation: fadeUp .5s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -1px;
    margin-bottom: 8px;
  }
  .logo span { color: var(--accent); }

  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 36px; }

  .field { margin-bottom: 18px; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: var(--accent); }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn {
    width: 100%;
    background: var(--accent2);
    color: #0a0a0f;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity .2s, transform .1s;
  }
  .btn:hover { opacity: .9; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .link-row {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: var(--muted);
  }
  .link-row a { color: var(--accent); text-decoration: none; }

  .error {
    background: rgba(245,101,101,.1);
    border: 1px solid rgba(245,101,101,.3);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    color: var(--danger);
    margin-bottom: 16px;
    display: none;
  }
  .error.show { display: block; }

  .success {
    background: rgba(62,207,142,.1);
    border: 1px solid rgba(62,207,142,.3);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    color: var(--accent2);
    margin-bottom: 16px;
    display: none;
  }
  .success.show { display: block; }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<div class="card">
  <div class="logo">fin<span>track</span></div>
  <div class="subtitle">Создай аккаунт за минуту</div>

  <div class="error" id="error"></div>
  <div class="success" id="success"></div>

  <div class="row">
    <div class="field">
      <label>Имя</label>
      <input type="text" id="name" placeholder="Иван">
    </div>
    <div class="field">
      <label>Фамилия</label>
      <input type="text" id="surname" placeholder="Петров">
    </div>
  </div>
  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com">
  </div>
  <div class="field">
    <label>Пароль</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>

  <button class="btn" id="regBtn" onclick="register()">Создать аккаунт</button>

  <div class="link-row">
    Уже есть аккаунт? <a href="login.html">Войти</a>
  </div>
</div>

<script>
  const API = 'http://localhost:8000';

  async function register() {
    const name = document.getElementById('name').value.trim();
    const surname = document.getElementById('surname').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const err = document.getElementById('error');
    const ok = document.getElementById('success');
    const btn = document.getElementById('regBtn');

    err.classList.remove('show');
    ok.classList.remove('show');

    if (!name || !surname || !email || !password) {
      err.textContent = 'Заполните все поля';
      err.classList.add('show');
      return;
    }

    if (password.length < 6) {
      err.textContent = 'Пароль должен быть не менее 6 символов';
      err.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Создаём...';

    try {
      const res = await fetch(`${API}/users/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, surname, email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        err.textContent = data.detail || 'Ошибка регистрации';
        err.classList.add('show');
        return;
      }

      ok.textContent = 'Аккаунт создан! Перенаправляем...';
      ok.classList.add('show');
      setTimeout(() => window.location.href = 'login.html', 1500);

    } catch (e) {
      err.textContent = 'Не удалось подключиться к серверу';
      err.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Создать аккаунт';
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') register();
  });
</script>
</body>
</html>
